name: Apply site-wide typography update

on:
  push:
    branches:
      - ui-attributes-font-size-16px

permissions:
  contents: write

jobs:
  typography:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Apply typography-only CSS overrides
        run: |
          python - <<'PY'
          from pathlib import Path

          app = Path("app.py")
          app_text = app.read_text(encoding="utf-8")
          app_css = """
/* Site-wide readability: body/supporting text is 14px; labels, titles and headings retain their hierarchy. */
.brand,.top-title,.hero-title,.input-title,.decision-state,.advisory-title,.detail-title,.review-title,.pipeline-head span,.stage-name{font-size:inherit}
.sub,.top-sub,.hero-sub,.trust-card strong,.side-row,.input-note,.scenario-label,.stage-note,.decision-id,.decision-note,.reason-box span,.score-meter-head,.attribute-card strong,.advisory-note,.advisory-summary > span:not(.status-chip),.detail-note,.verify-copy,.impact-node span,.table-empty,.evidence-value,.review-note{font-size:14px!important}
.data-table td{font-size:14px!important}
""".strip()
          marker = "/* Site-wide readability: body/supporting text is 14px; labels, titles and headings retain their hierarchy. */"
          if marker not in app_text:
              if app_text.count("</style>") != 1:
                  raise SystemExit("Unexpected app.py style block count")
              app_text = app_text.replace("</style>", app_css + "\n</style>", 1)
              app.write_text(app_text, encoding="utf-8")

          page_css = {
              "pages/1_Evaluation.py": """
/* Site-wide readability: body/supporting text is 14px; labels, titles and headings retain their hierarchy. */
.hero-copy,.callout,.metric-note,.case-value{font-size:14px!important}
[data-testid=\"stCaptionContainer\"] p,[data-testid=\"stWidgetLabel\"] p,[data-testid=\"stMarkdownContainer\"] p{font-size:14px!important;line-height:1.5}
""".strip(),
              "pages/2_Harmonization.py": """
/* Site-wide readability: body/supporting text is 14px; labels, titles and headings retain their hierarchy. */
.copy,.attrs,.node span,.record-desc{font-size:14px!important}
.card [style*=\"font-size:.55rem\"],.card [style*=\"font-size:.65rem\"]{font-size:14px!important;line-height:1.5!important}
[data-testid=\"stCaptionContainer\"] p,[data-testid=\"stWidgetLabel\"] p,[data-testid=\"stMarkdownContainer\"] p{font-size:14px!important;line-height:1.5}
""".strip(),
              "pages/3_Operations.py": """
/* Site-wide readability: body/supporting text is 14px; labels, titles and headings retain their hierarchy. */
[data-testid=\"stCaptionContainer\"] p,[data-testid=\"stWidgetLabel\"] p,[data-testid=\"stMarkdownContainer\"] p{font-size:14px!important;line-height:1.5}
[data-testid=\"stAlert\"] p{font-size:14px!important;line-height:1.5}
""".strip(),
          }

          for name, css in page_css.items():
              path = Path(name)
              text = path.read_text(encoding="utf-8")
              if marker not in text:
                  if text.count("</style>") != 1:
                      raise SystemExit(f"Unexpected style block count in {name}")
                  text = text.replace("</style>", css + "\n</style>", 1)
                  path.write_text(text, encoding="utf-8")

          workflow = Path(".github/workflows/_typography_update.yml")
          workflow.unlink()
          PY

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app.py pages/1_Evaluation.py pages/2_Harmonization.py pages/3_Operations.py .github/workflows/_typography_update.yml
          git commit -m "style: standardize site-wide body typography"
          git push origin HEAD:ui-attributes-font-size-16px

          # Keep the branch free of the helper workflow after the generated commit.
          echo "Typography update complete."
