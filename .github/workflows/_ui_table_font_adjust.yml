name: Apply table font adjustment

on:
  push:
    branches:
      - ui-attributes-font-size-16px

permissions:
  contents: write

jobs:
  adjust:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Apply scoped 14px table body font
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path("app.py")
          text = p.read_text(encoding="utf-8")
          old = ".data-table.attributes td,.data-table.candidate td{font-size:14px}"
          new = ".data-table td{font-size:14px}"
          if old not in text:
              raise SystemExit("Expected existing scoped table font rule was not found")
          p.write_text(text.replace(old, new, 1), encoding="utf-8")
          PY
          rm .github/workflows/_ui_table_font_adjust.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app.py .github/workflows/_ui_table_font_adjust.yml
          git commit -m "style: standardize table body font size"
          git push origin HEAD:ui-attributes-font-size-16px
