name: Fix wide table scroll

on:
  push:
    branches:
      - fix/ui-horizontal-table-scroll

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Patch dataframe column widths
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path("app.py")
          text = path.read_text(encoding="utf-8")

          old_candidate = '            st.dataframe(candidate_rows(candidates), hide_index=True, use_container_width=True)'
          new_candidate = '''            st.dataframe(
                candidate_rows(candidates),
                hide_index=True,
                use_container_width=True,
                column_config={
                    "Canonical material ID": st.column_config.TextColumn(width="medium"),
                    "Decision": st.column_config.TextColumn(width="medium"),
                    "Score": st.column_config.NumberColumn(width="small"),
                    "Explanation": st.column_config.TextColumn(width="large"),
                },
            )'''

          old_advisory = '                st.dataframe(advisory_rows(rows, score_label), hide_index=True, use_container_width=True)'
          new_advisory = '''                st.dataframe(
                    advisory_rows(rows, score_label),
                    hide_index=True,
                    use_container_width=True,
                    column_config={
                        "Canonical material ID": st.column_config.TextColumn(width="medium"),
                        "Source": st.column_config.TextColumn(width="medium"),
                        score_label: st.column_config.NumberColumn(width="small"),
                        "Reason": st.column_config.TextColumn(width="large"),
                    },
                )'''

          if text.count(old_candidate) != 1:
              raise SystemExit("Expected deterministic candidate dataframe call exactly once")
          if text.count(old_advisory) != 1:
              raise SystemExit("Expected advisory dataframe call exactly once")

          text = text.replace(old_candidate, new_candidate).replace(old_advisory, new_advisory)
          path.write_text(text, encoding="utf-8")
          PY
      - name: Validate and commit only app.py
        run: |
          python -m py_compile app.py
          git status --short
          git diff --check
          git diff -- app.py
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app.py
          git rm .github/workflows/fix-wide-table-scroll.yml
          git commit -m "Fix horizontal scrolling for wide tables"
          git push origin HEAD:fix/ui-horizontal-table-scroll
