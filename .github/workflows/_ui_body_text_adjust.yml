name: Apply UI body text adjustment

on:
  push:
    branches:
      - ui-attributes-font-size-16px

permissions:
  contents: write

jobs:
  adjust:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Increase only small body text
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          p = Path("app.py")
          text = p.read_text(encoding="utf-8")

          # Keep labels/headings unchanged; only enlarge the readable values.
          text, evidence_count = re.subn(
              r'(\.evidence-value\{[^}]*?font-size:)[^;]+(;)',
              r'\g<1>14px\2',
              text,
              count=1,
          )
          text, attribute_count = re.subn(
              r'(\.attribute-card strong\{[^}]*?font-size:)[^;]+(;)',
              r'\g<1>14px\2',
              text,
              count=1,
          )

          if evidence_count != 1 or attribute_count != 1:
              raise SystemExit(
                  f"Expected one evidence-value and one attribute-card strong rule; "
                  f"found {evidence_count} and {attribute_count}"
              )

          p.write_text(text, encoding="utf-8")
          PY
          rm .github/workflows/_ui_body_text_adjust.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app.py .github/workflows/_ui_body_text_adjust.yml
          git commit -m "style: enlarge small result body text"
          git push origin HEAD:ui-attributes-font-size-16px
