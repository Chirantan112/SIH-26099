name: Apply typography weight update

on:
  push:
    branches:
      - ui-attributes-font-size-16px

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Increase readable body weight
        run: |
          python - <<'PY'
          from pathlib import Path

          files = [Path("app.py"), Path("pages/1_Evaluation.py"), Path("pages/2_Harmonization.py"), Path("pages/3_Operations.py")]
          marker = "/* Readability weight update: medium body text for dashboard and pages. */"
          css = """
          /* Readability weight update: medium body text for dashboard and pages. */
          .sub,.top-sub,.hero-sub,.side-row,.input-note,.scenario-label,.stage-note,.decision-id,.decision-note,.reason-box span,.score-meter-head,.attribute-card strong,.advisory-note,.advisory-summary > span:not(.status-chip),.detail-note,.verify-copy,.impact-node span,.table-empty,.evidence-value,.review-note,.pipeline-head small{font-weight:600!important}
          .stage-name{font-weight:700!important}
          .data-table td{font-weight:600!important}
          """.strip()

          for path in files:
              text = path.read_text(encoding="utf-8")
              if marker not in text:
                  if text.count("</style>") != 1:
                      raise SystemExit(f"Unexpected style block count in {path}")
                  text = text.replace("</style>", css + "\n</style>", 1)
                  path.write_text(text, encoding="utf-8")

          workflow = Path(".github/workflows/_typography_weight_update.yml")
          workflow.unlink()
          PY
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app.py pages/1_Evaluation.py pages/2_Harmonization.py pages/3_Operations.py .github/workflows/_typography_weight_update.yml
          git commit -m "style: strengthen readable body typography"
          git push origin HEAD:ui-attributes-font-size-16px
