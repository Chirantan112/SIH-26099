name: apply-ui-redesign

on:
  push:
    branches: ["ui/light-dark-redesign"]

permissions:
  contents: write

jobs:
  redesign:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply light-dark UI redesign
        shell: python
        run: |
          from pathlib import Path
          p = Path("app.py")
          s = p.read_text(encoding="utf-8")

          # Keep the existing dark design intact and layer a separately designed light system over it.
          s = s.replace("def _css() -> None:", "def _base_css() -> None:", 1)

          marker = '\ndef _table_html(rows: list[dict[str, Any]], kind: str = "default") -> str:\n'
          theme_fn = r'''

def _css(dark_mode: bool) -> None:
    _base_css()
    if dark_mode:
        return
    st.markdown(
        """
<style>
/* Dedicated light palette: never rely on dark-theme white text or dark surfaces. */
.stApp{background:radial-gradient(850px 500px at 85% -10%,rgba(8,127,165,.10),transparent 62%),#f4f7f9!important;color:#172633!important}
[data-testid="stSidebar"]{background:#ffffff!important;border-right:1px solid #d6e0e7!important}
.brand,.top-title,.input-title,.decision-state,.decision-id,.advisory-title,.detail-title,.review-title,.stage-name,.trust-card strong,.attribute-card strong{color:#172633!important}
.sub,.top-sub,.input-note,.section-title,.pipeline-head small,.stage-note,.decision-note,.reason-box b,.score-meter-head,.advisory-note,.advisory-summary span,.detail-note,.verify-copy,.review-note,.side-kicker,.side-right,.evidence-label{color:#637987!important}
.card,.trust-card,.pipeline,.stage,.decision-card,.detail-card,.evidence-box,.impact-map,.review-card,.audit-card,.data-table,.attribute-card{background:#ffffff!important;border-color:#d6e0e7!important;box-shadow:0 10px 28px rgba(31,55,72,.07)!important}
.hero{background:linear-gradient(135deg,#e7f3f7,#ffffff)!important;border-color:#c7dce5!important;box-shadow:0 20px 55px rgba(31,55,72,.08)!important}
.hero-sub{color:#637987!important}.pill{background:#ffffff!important;color:#4f6877!important;border-color:#cbdce4!important}.pill.online{color:#16865a!important;border-color:rgba(22,134,90,.28)!important}
.trust-card.primary strong,.decision-kicker,.decision-score,.score-cell,.table-decision.same{color:#16865a!important}
.decision-card{background:linear-gradient(145deg,rgba(22,134,90,.08),#fff 72%)!important;border-color:rgba(22,134,90,.38)!important}.decision-card.uncertain{background:linear-gradient(145deg,rgba(155,101,0,.08),#fff 72%)!important;border-color:rgba(155,101,0,.38)!important}.decision-card.new{background:linear-gradient(145deg,rgba(8,127,165,.08),#fff 72%)!important;border-color:rgba(8,127,165,.38)!important}
.decision-card.uncertain .decision-kicker,.decision-card.uncertain .decision-score,.table-decision.uncertain{color:#9b6500!important}.decision-card.new .decision-kicker,.decision-card.new .decision-score,.table-decision.new{color:#087fa5!important}
.reason-box,.advisory-summary,.impact-node,.stage,.attribute-card{background:#f7fafc!important;border-color:#d6e0e7!important}.reason-box span{color:#172633!important}.score-track{background:#dfe8ed!important}.score-fill{background:#16865a!important}.decision-card.uncertain .score-fill{background:#9b6500!important}.decision-card.new .score-fill{background:#087fa5!important}
.advisory-panel{background:linear-gradient(145deg,rgba(112,81,174,.07),#fff)!important;border-color:rgba(112,81,174,.30)!important}.advisory-kicker,.advisory-summary strong,.status-chip{color:#7051ae!important}
.stButton button{background:#ffffff!important;color:#172633!important;border-color:#d6e0e7!important}.stButton button:hover{border-color:rgba(8,127,165,.55)!important}.stButton button[kind="primary"]{background:#087fa5!important;color:#fff!important;border-color:#087fa5!important}
[data-baseweb="textarea"]>div,[data-baseweb="input"]>div{background:#fff!important;border-color:#d6e0e7!important}[data-baseweb="textarea"] textarea{color:#172633!important}.data-table th{background:#eef3f6!important;color:#637987!important}.data-table td{color:#172633!important;border-color:#d6e0e7!important}.table-empty{border-color:#d6e0e7!important;color:#637987!important}
.stage.done{background:rgba(22,134,90,.07)!important;border-color:rgba(22,134,90,.32)!important}.stage.active{border-color:rgba(8,127,165,.42)!important}.stage.unavailable{background:rgba(155,101,0,.07)!important;border-color:rgba(155,101,0,.35)!important}.stage-icon{border-color:#d6e0e7!important}
.theme-switch{background:#f7fafc!important;border-color:#d6e0e7!important}.theme-label{color:#172633!important}
</style>
""",
        unsafe_allow_html=True,
    )
'''
          if marker not in s:
              raise SystemExit("UI marker not found")
          s = s.replace(marker, theme_fn + marker, 1)

          # Replace only the presentation sidebar. The analysis-mode control and all backend calls stay the same.
          start = s.index("def _sidebar() -> bool:")
          end = s.index("\ndef _header(ai: bool) -> None:", start)
          sidebar = '''def _sidebar() -> bool:
    with st.sidebar:
        st.markdown(
            '<div class="brand"><span class="brand-mark">◆</span> CPSE MATERIAL<br>HARMONIZATION</div><div class="sub">SIH 2026 · PS 26099</div>',
            unsafe_allow_html=True,
        )
        st.markdown(
            '<div class="theme-switch"><span class="theme-icon">☀️</span><span class="theme-label">Appearance</span><span class="theme-icon">🌙</span></div>',
            unsafe_allow_html=True,
        )
        st.toggle("Dark mode", value=st.session_state.get("dark_mode", True), key="dark_mode", label_visibility="collapsed")
        st.markdown(
            '<div class="side-kicker">System</div><div class="side-row"><span class="dot-green">●</span>SYSTEM ONLINE</div>',
            unsafe_allow_html=True,
        )
        selected = st.segmented_control(
            "Analysis mode", ["Deterministic Only", "Hybrid AI"],
            default="Deterministic Only" if not st.session_state.get("ai_enabled", False) else "Hybrid AI",
            key="analysis_mode_selector", label_visibility="collapsed", width="stretch",
        )
        ai = selected == "Hybrid AI"
        st.session_state["ai_enabled"] = ai
        st.markdown(
            '<div class="side-kicker">Decision authority</div><div class="side-row"><span class="dot-green">◇</span>Deterministic Engine<span class="side-right">AUTHORITATIVE</span></div>',
            unsafe_allow_html=True,
        )
        st.markdown(
            '<div class="side-kicker">Advisory services</div><div class="side-row"><span class="dot-purple">✦</span>Local NLP<span class="side-right">ADVISORY</span></div><div class="side-row"><span class="dot-purple">✦</span>Gemini 2.5 Flash<span class="side-right">ADVISORY</span></div>',
            unsafe_allow_html=True,
        )
        st.markdown(
            '<div class="side-kicker">Data source</div><div class="side-row"><span class="dot-green">●</span>Demo material master<span class="side-right">SYNTHETIC</span></div><div class="side-row"><span class="dot-cyan">○</span>SAP / ERP<span class="side-right">BOUNDARY</span></div>',
            unsafe_allow_html=True,
        )
        st.markdown(
            '<div class="side-kicker">System status</div><div class="side-row"><span class="dot-green">●</span>Deterministic engine<span class="side-right">READY</span></div><div class="side-row"><span class="dot-purple">●</span>Optional AI layer<span class="side-right">ADVISORY</span></div>',
            unsafe_allow_html=True,
        )
        return ai

'''
          s = s[:start] + sidebar + s[end+1:]

          # Initialize the appearance preference before rendering CSS; the existing AI/pipeline state remains untouched.
          s = s.replace('(\n        ("ai_enabled", False),', '(\n        ("dark_mode", True),\n        ("ai_enabled", False),', 1)
          needle = '    for key, value in defaults:\n        st.session_state.setdefault(key, value)\n\n    ai = _sidebar()'
          replacement = '    for key, value in defaults:\n        st.session_state.setdefault(key, value)\n\n    _css(bool(st.session_state.get("dark_mode", True)))\n    ai = _sidebar()'
          if needle not in s:
              raise SystemExit("main initialization marker not found")
          s = s.replace(needle, replacement, 1)

          p.write_text(s, encoding="utf-8")

      - name: Validate Python syntax
        run: python -m py_compile app.py
      - name: Remove one-shot workflow and commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/ui-redesign.yml
          git add app.py
          git commit -m "feat(ui): redesign light and dark themes"
          git push
