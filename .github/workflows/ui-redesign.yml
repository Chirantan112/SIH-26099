name: apply-safe-theme-redesign

on:
  push:
    branches: ["ui/light-dark-redesign"]
  pull_request:
    branches: ["main"]

permissions:
  contents: write

jobs:
  redesign:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Apply presentation-only theme changes
        shell: python
        run: |
          from pathlib import Path

          p = Path("app.py")
          s = p.read_text(encoding="utf-8")

          required = ["def _css() -> None:", "def _sidebar() -> bool:", "def _header(ai: bool) -> None:"]
          for marker in required:
              if marker not in s:
                  raise SystemExit(f"Required UI marker missing: {marker}")

          s = s.replace("def _css() -> None:", "def _dark_css() -> None:", 1)

          light_css = r'''

def _css() -> None:
    _dark_css()
    if st.session_state.get("dark_mode", True):
        return
    st.markdown(
        """
<style>
/* Dedicated light theme. Dark-mode text/surfaces are never reused in light mode. */
.stApp{background:radial-gradient(900px 520px at 86% -12%,rgba(8,127,165,.10),transparent 62%),#f4f7f9!important;color:#172633!important}
.block-container{color:#172633!important}
[data-testid="stSidebar"]{background:#ffffff!important;border-right:1px solid #d6e0e7!important;color:#172633!important}
[data-testid="stSidebar"]>div:first-child{background:#ffffff!important}
.brand,.top-title,.input-title,.decision-state,.decision-id,.trust-card strong,.attribute-card strong,.stage-name,.detail-title,.review-title,.advisory-title{color:#172633!important}
.sub,.top-sub,.input-note,.section-title,.scenario-label,.pipeline-head small,.stage-note,.decision-note,.reason-box b,.score-meter-head,.advisory-note,.advisory-summary span,.detail-note,.verify-copy,.review-note,.side-kicker,.side-right,.evidence-label{color:#637987!important}
.side-row{color:#172633!important;border-bottom-color:#e2e9ee!important}
.top-status,.theme-switch,.card,.trust-card,.pipeline,.stage,.decision-card,.detail-card,.evidence-box,.impact-map,.review-card,.audit-card,.attribute-card{background:#ffffff!important;border-color:#d6e0e7!important;box-shadow:0 10px 28px rgba(31,55,72,.07)!important}
.top-status{color:#172633!important}
.hero{background:linear-gradient(135deg,#e6f3f7,#ffffff 72%)!important;border-color:#c7dce5!important;box-shadow:0 20px 55px rgba(31,55,72,.08)!important}
.eyebrow{color:#087fa5!important}.hero-title{color:#172633!important}.hero-title span{color:#087fa5!important}.hero-sub{color:#637987!important}
.pill{background:#ffffff!important;color:#4f6877!important;border-color:#cbdce4!important}.pill.online{color:#16865a!important;border-color:rgba(22,134,90,.28)!important}
.trust-card.primary strong,.decision-kicker,.decision-score,.table-decision.same{color:#16865a!important}
.decision-card{background:linear-gradient(145deg,rgba(22,134,90,.08),#ffffff 72%)!important;border-color:rgba(22,134,90,.38)!important}.decision-card.uncertain{background:linear-gradient(145deg,rgba(155,101,0,.08),#ffffff 72%)!important;border-color:rgba(155,101,0,.38)!important}.decision-card.new{background:linear-gradient(145deg,rgba(8,127,165,.08),#ffffff 72%)!important;border-color:rgba(8,127,165,.38)!important}
.decision-card.uncertain .decision-kicker,.decision-card.uncertain .decision-score,.table-decision.uncertain{color:#9b6500!important}.decision-card.new .decision-kicker,.decision-card.new .decision-score,.table-decision.new{color:#087fa5!important}
.reason-box,.advisory-summary,.impact-node,.stage,.attribute-card{background:#f7fafc!important;border-color:#d6e0e7!important}.reason-box span{color:#172633!important}.score-track{background:#dfe8ed!important}.score-fill{background:#16865a!important}.decision-card.uncertain .score-fill{background:#9b6500!important}.decision-card.new .score-fill{background:#087fa5!important}
.advisory-panel{background:linear-gradient(145deg,rgba(112,81,174,.07),#ffffff)!important;border-color:rgba(112,81,174,.30)!important}.advisory-kicker,.advisory-summary strong,.status-chip{color:#7051ae!important}
.stButton button{background:#ffffff!important;color:#172633!important;border-color:#d6e0e7!important}.stButton button:hover{border-color:rgba(8,127,165,.55)!important}.stButton button[kind="primary"]{background:#087fa5!important;color:#ffffff!important;border-color:#087fa5!important}
[data-baseweb="textarea"]>div,[data-baseweb="input"]>div{background:#ffffff!important;border-color:#d6e0e7!important}[data-baseweb="textarea"] textarea{color:#172633!important}input,textarea{color:#172633!important}
.data-table{background:#ffffff!important;border-color:#d6e0e7!important}.data-table th{background:#eef3f6!important;color:#637987!important;border-color:#d6e0e7!important}.data-table td{color:#172633!important;border-color:#d6e0e7!important}
.stage.done{background:rgba(22,134,90,.07)!important;border-color:rgba(22,134,90,.32)!important}.stage.active{border-color:rgba(8,127,165,.42)!important}.stage.unavailable{background:rgba(155,101,0,.07)!important;border-color:rgba(155,101,0,.35)!important}.stage-icon{border-color:#d6e0e7!important}
[data-testid="stSidebar"] [data-testid="stSegmentedControl"] button{background:#f7fafc!important;color:#172633!important;border-color:#d6e0e7!important}[data-testid="stSidebar"] [data-testid="stSegmentedControl"] button[aria-pressed="true"]{background:#e4f2f6!important;color:#087fa5!important;border-color:#087fa5!important}
.theme-switch{display:flex;align-items:center;justify-content:space-between!important;gap:.45rem;padding:.42rem .62rem!important;border-radius:999px!important;background:#f7fafc!important;border-color:#d6e0e7!important;color:#172633!important}.theme-label{color:#172633!important;font-size:.52rem!important;font-weight:950!important;letter-spacing:.1em!important}.theme-icon{font-size:.72rem!important}
[data-testid="stSidebar"] [data-testid="stToggle"]{display:flex!important;justify-content:center!important;margin-top:-2.25rem!important;margin-bottom:.85rem!important;position:relative!important;z-index:2!important}[data-testid="stSidebar"] [data-testid="stToggle"] label p{font-size:0!important}
@media(max-width:700px){.hero{border-radius:16px!important}.trust-row{grid-template-columns:1fr 1fr!important}.result-layout{grid-template-columns:1fr!important}}
</style>
""",
        unsafe_allow_html=True,
    )
'''

          css_end = s.index("\ndef _table", s.index("def _dark_css() -> None:"))
          s = s[:css_end] + light_css + s[css_end:]

          sidebar_start = s.index("def _sidebar() -> bool:")
          sidebar_end = s.index("\ndef _header(ai: bool) -> None:", sidebar_start)
          sidebar = s[sidebar_start:sidebar_end]
          if 'key="dark_mode"' not in sidebar:
              needle = "    with st.sidebar:\n"
              toggle = '''    with st.sidebar:\n        st.markdown(\n            '<div class="theme-switch"><span class="theme-icon">☀️</span><span class="theme-label">APPEARANCE</span><span class="theme-icon">🌙</span></div>',\n            unsafe_allow_html=True,\n        )\n        st.toggle("Dark mode", value=st.session_state.get("dark_mode", True), key="dark_mode", label_visibility="collapsed")\n'''
              if needle not in sidebar:
                  raise SystemExit("Sidebar insertion marker missing")
              sidebar = sidebar.replace(needle, toggle, 1)
              s = s[:sidebar_start] + sidebar + s[sidebar_end:]

          main_start = s.index("def main() -> None:")
          main_end = s.index("\nif __name__ ==", main_start)
          main = s[main_start:main_end]
          if 'st.session_state.setdefault("dark_mode", True)' not in main:
              anchor = '    st.session_state.setdefault("ai_enabled", False)'
              if anchor not in main:
                  raise SystemExit("AI state initialization marker missing")
              main = main.replace(anchor, '    st.session_state.setdefault("dark_mode", True)\n' + anchor, 1)
          if "_css()\n    ai = _sidebar()" in main:
              main = main.replace("    _css()\n    ai = _sidebar()", "    ai = _sidebar()\n    _css()", 1)
          elif "ai = _sidebar()\n    _css()" not in main:
              raise SystemExit("Could not safely place theme rendering")
          s = s[:main_start] + main + s[main_end:]

          p.write_text(s, encoding="utf-8")

      - name: Validate syntax and existing tests
        run: |
          python -m py_compile app.py
          python -m unittest discover -s tests -v

      - name: Commit only app.py and remove temporary workflow
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git diff --name-only
          git diff -- app.py
          test "$(git diff --name-only)" = "app.py"
          git rm .github/workflows/ui-redesign.yml
          git add app.py
          git commit -m "feat(ui): safe light and dark theme redesign"
          git push
