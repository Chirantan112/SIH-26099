name: Apply UI redesign

on:
  push:
    branches: [feat/impactful-responsive-ui]

permissions:
  contents: write

jobs:
  ui:
    if: "!startsWith(github.event.head_commit.message, 'ui: apply responsive judge UI')"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Apply UI-only patch
        shell: python
        run: |
          from pathlib import Path
          import re

          path = Path('app.py')
          text = path.read_text(encoding='utf-8')

          # Only presentation functions are changed. Backend orchestration and AI adapters remain byte-for-byte untouched.
          extra_css = r'''
          /* Judge-impact additions: theme-aware, responsive, presentation only. */
          .hero-impact{display:grid;grid-template-columns:1.6fr repeat(3,1fr);gap:.55rem;margin-top:.8rem}
          .impact-chip{padding:.7rem .8rem;border:1px solid var(--line);border-radius:13px;background:rgba(255,255,255,.025)}
          .impact-chip small{display:block;color:var(--muted);font-size:.55rem;font-weight:900;letter-spacing:.09em;text-transform:uppercase}
          .impact-chip strong{display:block;margin-top:.28rem;color:var(--text);font-size:.72rem;line-height:1.25}
          .impact-chip.primary strong{color:var(--green)}
          .why-card{margin-top:.75rem;padding:1rem;border:1px solid rgba(66,200,238,.25);border-radius:18px;background:linear-gradient(145deg,rgba(11,37,56,.35),rgba(7,15,26,.96))}
          .why-head{display:flex;align-items:center;justify-content:space-between;gap:.7rem}.why-title{font-size:.9rem;font-weight:950}.why-badge{padding:.3rem .55rem;border:1px solid rgba(85,227,154,.3);border-radius:999px;color:var(--green);font-size:.55rem;font-weight:950}
          .why-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:.45rem;margin-top:.65rem}.why-item{padding:.58rem;border:1px solid rgba(145,168,190,.12);border-radius:11px;background:rgba(7,16,28,.62)}.why-label{color:var(--muted);font-size:.52rem;font-weight:900;text-transform:uppercase;letter-spacing:.07em}.why-value{margin-top:.2rem;color:var(--text);font-size:.62rem;font-weight:850}.why-value.missing{color:var(--amber)}
          .impact-map{margin-top:.7rem;padding:1rem;border:1px solid rgba(85,227,154,.2);border-radius:18px;background:linear-gradient(135deg,rgba(12,48,37,.25),rgba(7,16,27,.96))}.impact-map-head{display:flex;justify-content:space-between;gap:.6rem;align-items:end}.impact-map-title{font-size:.9rem;font-weight:950}.impact-map-note{color:var(--muted);font-size:.55rem;text-align:right}.impact-flow{display:grid;grid-template-columns:1fr auto 1fr auto 1fr;align-items:center;gap:.4rem;margin-top:.7rem}.impact-node{padding:.62rem;border:1px solid var(--line);border-radius:11px;background:rgba(7,16,28,.65);text-align:center}.impact-node strong{display:block;color:var(--text);font-size:.63rem}.impact-node span{display:block;margin-top:.15rem;color:var(--muted);font-size:.52rem}.impact-arrow{color:var(--cyan);font-weight:950;text-align:center}.impact-foot{margin-top:.6rem;padding:.5rem .6rem;border:1px solid rgba(85,227,154,.14);border-radius:10px;background:rgba(85,227,154,.04);color:#b8cbd6;font-size:.58rem;text-align:center}.impact-foot strong{color:var(--green)}
          @media(prefers-color-scheme:light){.impact-chip,.why-card,.why-item,.impact-map,.impact-node{background:#fff}.why-value,.impact-node strong{color:#183043}.hero-impact .impact-chip{box-shadow:0 6px 18px rgba(24,47,68,.06)}}
          @media(max-width:1100px){.hero-impact{grid-template-columns:1.5fr 1fr 1fr}.hero-impact .impact-chip:last-child{display:none}.why-grid{grid-template-columns:repeat(2,1fr)}}
          @media(max-width:760px){.hero-impact{grid-template-columns:1fr 1fr}.hero-impact .impact-chip:first-child{grid-column:1/-1}.why-grid{grid-template-columns:1fr}.impact-flow{grid-template-columns:1fr;gap:.25rem}.impact-arrow{transform:rotate(90deg)}.impact-map-head{display:block}.impact-map-note{text-align:left;margin-top:.25rem}}
          @media(max-width:430px){.hero-impact{grid-template-columns:1fr}.hero-impact .impact-chip:first-child{grid-column:auto}.hero-impact .impact-chip:last-child{display:block}}
          '''
          marker = '    </style>\n    """, unsafe_allow_html=True)'
          if extra_css.strip() not in text:
              text = text.replace(marker, extra_css + '\n' + marker, 1)

          header = '''def _render_header(ai_enabled: bool) -> None:
    mode = "HYBRID AI" if ai_enabled else "DETERMINISTIC ONLY"
    st.markdown(f'<div class="hero"><div class="eyebrow">CPSE MATERIAL INTELLIGENCE · SIH 2026</div><div class="hero-title">One material. <span>Many codes.</span><br>One trusted identity.</div><div class="hero-sub">AI-assisted standardization of legacy CPSE material descriptions into a common canonical vocabulary — with deterministic technical verification as the final authority.</div><div class="pills"><span class="pill">PS 26099</span><span class="pill online">● SYSTEM ONLINE</span><span class="pill">MODE · {mode}</span><span class="pill">SYNTHETIC DEMO DATA · CLEARLY LABELLED</span></div></div>', unsafe_allow_html=True)
    st.markdown('<div class="hero-impact"><div class="impact-chip primary"><small>Core outcome</small><strong>Legacy descriptions → common material identity</strong></div><div class="impact-chip"><small>Decision source</small><strong>Deterministic rules</strong></div><div class="impact-chip"><small>AI role</small><strong>Candidate discovery only</strong></div><div class="impact-chip"><small>Governance</small><strong>Auditable + reviewable</strong></div></div>', unsafe_allow_html=True)
    st.markdown('<div class="decision-banner"><strong>🛡 Decision authority:</strong> deterministic matching is always the final decision source. Local NLP and Gemini provide separate advisory intelligence only.</div>', unsafe_allow_html=True)


'''
          text = re.sub(r'def _render_header\(ai_enabled: bool\) -> None:\n.*?\n\ndef _render_architecture', header + 'def _render_architecture', text, count=1, flags=re.S)

          analysis = '''def _render_analysis(result: HybridResult) -> None:
    st.markdown('<div class="result-section"><div class="result-head"><h2>Evidence &amp; Details</h2><p>Transparent evidence behind the authoritative decision</p></div>', unsafe_allow_html=True)
    raw = escape(st.session_state.get("material_description", ""))
    norm = escape(result.normalized_description or "Not provided")
    transforms = "\\n".join(f"✓ {item}" for item in result.normalization_transformations) if result.normalization_transformations else "No transformations reported."
    st.markdown(f'<div class="evidence-grid"><div class="evidence"><div class="evidence-label">Original Description</div><div class="evidence-value">{raw}</div></div><div class="evidence"><div class="evidence-label">Normalized Description</div><div class="evidence-value">{norm}</div></div><div class="evidence"><div class="evidence-label">Normalization Transformations</div><div class="evidence-value">{escape(transforms)}</div></div><div class="evidence"><div class="evidence-label">Deterministic Explanation</div><div class="evidence-value">{escape(result.mapping_result.explanation or "No explanation reported.")}</div></div></div>', unsafe_allow_html=True)
    attrs = result.attributes
    evidence = (("Category", getattr(attrs, "category", None)), ("Valve type", getattr(attrs, "valve_type", None)), ("Material", getattr(attrs, "material", None)), ("Size", getattr(attrs, "size_mm", None)), ("Pressure", getattr(attrs, "pressure_class", None)), ("Connection", getattr(attrs, "connection", None)))
    available = sum(value is not None for _, value in evidence)
    why_items = ''.join(f'<div class="why-item"><div class="why-label">{escape(label)}</div><div class="why-value {"" if value is not None else "missing"}">{escape(_display_value(value))}</div></div>' for label, value in evidence)
    st.markdown(f'<div class="why-card"><div class="why-head"><div class="why-title">Why did the system reach this decision?</div><span class="why-badge">{available}/6 key attributes extracted</span></div><div class="why-grid">{why_items}</div></div>', unsafe_allow_html=True)
    cid = result.mapping_result.canonical_material_id or "Not assigned"
    st.markdown(f'<div class="impact-map"><div class="impact-map-head"><div class="impact-map-title">Harmonization impact</div><div class="impact-map-note">Derived only from records available to this demo</div></div><div class="impact-flow"><div class="impact-node"><strong>Legacy descriptions</strong><span>CPSE-specific wording</span></div><div class="impact-arrow">→</div><div class="impact-node"><strong>Technical identity</strong><span>Normalized + verified</span></div><div class="impact-arrow">→</div><div class="impact-node"><strong>{escape(str(cid))}</strong><span>Common material ID</span></div></div><div class="impact-foot"><strong>Candidate for consolidation:</strong> records resolving to the same canonical identity can be reviewed together.</div></div>', unsafe_allow_html=True)
    with st.expander("Technical Attributes", expanded=False):
        st.dataframe(attribute_rows(result.attributes), hide_index=True, use_container_width=True)
    with st.expander("Deterministic Candidate Evidence", expanded=False):
        candidates = result.mapping_result.all_candidates
        if candidates:
            st.dataframe(candidate_rows(candidates), hide_index=True, use_container_width=True)
        else:
            st.caption("No candidate evidence is available.")
    _render_ai_consensus(result)
    _render_advisory(result)
    _render_review(result)
    _render_audit_trail()
    st.markdown('</div>', unsafe_allow_html=True)


'''
          text = re.sub(r'def _render_analysis\(result: HybridResult\) -> None:\n.*?\n\ndef _render_ai_consensus', analysis + 'def _render_ai_consensus', text, count=1, flags=re.S)

          path.write_text(text, encoding='utf-8')
          compile(text, 'app.py', 'exec')
      - name: Commit UI-only change
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app.py
          git diff --cached --check
          git diff --cached -- app.py
          git commit -m "ui: apply responsive judge UI"
          git push

# Triggered once more after workflow creation so the UI patch can be applied on-branch.
