name: Apply UI stabilization patch

on:
  push:
    branches:
      - fix/ui-stabilization-v2

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Apply CSS-only stabilization
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path("app.py")
          text = path.read_text(encoding="utf-8")
          marker = "    </style>\n    \"\"\")"
          if marker not in text or "/* UI STABILIZATION PATCH */" in text:
              raise SystemExit("Expected style terminator missing or patch already present; refusing modification")
          patch = r'''    /* UI STABILIZATION PATCH */
    .stApp, .main, [data-testid="stAppViewContainer"] { min-width: 0; }
    .block-container { width: 100%; max-width: 1680px; box-sizing: border-box; overflow-x: hidden; }
    .hero, .card, .input-card, .pipeline, .authority, .glance, .evidence { box-sizing: border-box; min-width: 0; }
    .hero-title, .hero-sub, .service-main, .service-note, .authority-explain, .stage-name, .stage-note, .glance-row, .result-head h2, .result-head p, .decision-banner { overflow-wrap: anywhere; word-break: normal; }
    .flow { width: 100%; min-width: 0; }
    .stage { min-width: 0; overflow: hidden; }
    .stage-name, .stage-note { white-space: normal; }
    [data-testid="stDataFrame"] { width: 100%; max-width: 100%; min-width: 0; }
    [data-testid="stDataFrame"] > div { max-width: 100%; overflow-x: auto !important; }
    [data-testid="stDataFrame"] [role="grid"] { min-width: max-content; }
    @media (max-width: 1100px) {
        .flow { grid-template-columns: repeat(3, minmax(0, 1fr)); }
        .stage:not(:last-child):after { display: none; }
        .evidence-grid { grid-template-columns: 1fr; }
    }
    @media (max-width: 760px) {
        .block-container { padding-left: .75rem; padding-right: .75rem; }
        .flow { grid-template-columns: repeat(2, minmax(0, 1fr)); }
        .hero-title { font-size: clamp(1.9rem, 10vw, 2.7rem); }
        .result-head { align-items: flex-start; flex-direction: column; }
        .result-head p { text-align: left; }
    }
    @media (prefers-color-scheme: light) {
        .stApp {
            --bg: var(--st-background-color, #ffffff);
            --panel: var(--st-secondary-background-color, #f7f7f8);
            --panel2: var(--st-secondary-background-color, #f0f2f6);
            --panel3: var(--st-secondary-background-color, #e8eaed);
            --line: var(--st-border-color, #d9dce1);
            --text: var(--st-text-color, #1f2937);
            --muted: color-mix(in srgb, var(--st-text-color, #1f2937) 65%, transparent);
            background: var(--bg);
            color: var(--text);
        }
        [data-testid="stSidebar"] { background: var(--st-secondary-background-color, #f7f7f8); border-right-color: var(--st-border-color, #d9dce1); }
        .hero, .card, .input-card, .pipeline, .authority, .glance, .evidence, .decision-banner, .stage { background: var(--st-secondary-background-color, #f7f7f8); color: var(--st-text-color, #1f2937); box-shadow: none; }
        .hero { background: linear-gradient(135deg, var(--st-secondary-background-color, #f7f7f8), var(--st-background-color, #ffffff)); }
        .hero-title, .service-main, .authority-id, .result-head h2, .brand, .input-label, .stage-name { color: var(--st-text-color, #1f2937); }
        .hero-sub, .service-note, .authority-explain, .side-note, .sub, .stage-note, .result-head p { color: color-mix(in srgb, var(--st-text-color, #1f2937) 68%, transparent); }
        .decision-banner { background: var(--st-secondary-background-color, #f7f7f8); }
    }
    '''
          path.write_text(text.replace(marker, patch + marker, 1), encoding="utf-8")
          PY
      - name: Validate and commit app.py only
        run: |
          python -m py_compile app.py
          git diff --check
          test "$(git status --short | wc -l)" -eq 1
          test "$(git status --short | cut -c4-)" = "app.py"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app.py
          git commit -m "Stabilize dashboard UI layout"
          git rm .github/workflows/ui-stabilization-patch.yml
          git commit -m "Remove temporary UI patch workflow"
          git push origin HEAD:fix/ui-stabilization-v2
