name: Apply result body font adjustment

on:
  push:
    branches:
      - ui-attributes-font-size-16px

permissions:
  contents: write

jobs:
  adjust:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Update only missed result body text
        run: |
          python - <<'PY'
          from pathlib import Path

          p = Path("app.py")
          text = p.read_text(encoding="utf-8")

          replacements = {
              '.decision-note{margin-top:.55rem;color:#9db2c0;font-size:.57rem;': '.decision-note{margin-top:.55rem;color:#9db2c0;font-size:14px;',
              '.reason-box span{display:block;margin-top:.24rem;color:#dbe7ed;font-size:.58rem;': '.reason-box span{display:block;margin-top:.24rem;color:#dbe7ed;font-size:14px;',
              '.advisory-note{margin-top:.25rem;color:#899eae;font-size:.55rem;': '.advisory-note{margin-top:.25rem;color:#899eae;font-size:14px;',
              '.advisory-summary span{display:block;margin-top:.2rem;color:#a8b8c4;font-size:.54rem;': '.advisory-summary > span:not(.status-chip){display:block;margin-top:.2rem;color:#a8b8c4;font-size:14px;',
              '.detail-note{margin-top:.18rem;color:#7f96a8;font-size:.51rem}': '.detail-note{margin-top:.18rem;color:#7f96a8;font-size:14px}',
              '.verify-copy{margin-top:.5rem;color:#9eb2bf;font-size:.55rem;': '.verify-copy{margin-top:.5rem;color:#9eb2bf;font-size:14px;',
              '.impact-node span{display:block;margin-top:.12rem;color:#71899c;font-size:.46rem}': '.impact-node span{display:block;margin-top:.12rem;color:#71899c;font-size:14px}',
              '.table-empty{padding:.6rem;border:1px dashed var(--line);border-radius:9px;color:#7e95a6;font-size:.54rem}': '.table-empty{padding:.6rem;border:1px dashed var(--line);border-radius:9px;color:#7e95a6;font-size:14px}',
              '.review-note{margin-top:.18rem;color:#7f96a8;font-size:.52rem;': '.review-note{margin-top:.18rem;color:#7f96a8;font-size:14px;',
          }

          for old, new in replacements.items():
              if old not in text:
                  raise SystemExit(f"Missing expected selector: {old}")
              text = text.replace(old, new, 1)

          old = '<div class="input-note" style="margin-top:.25rem">The authoritative result is calculated from technical attribute comparison. AI evidence is advisory only.</div>'
          new = '<div class="input-note result-body-note" style="margin-top:.25rem">The authoritative result is calculated from technical attribute comparison. AI evidence is advisory only.</div>'
          if old not in text:
              raise SystemExit("Missing decision-authority body text")
          text = text.replace(old, new, 1)

          needle = '.data-table td{font-size:14px}'
          if needle not in text:
              raise SystemExit("Expected existing table font rule missing")
          text = text.replace(needle, needle + '.result-body-note{font-size:14px!important}div[data-testid="stCaptionContainer"] p{font-size:14px!important}', 1)

          p.write_text(text, encoding="utf-8")
          PY
          rm .github/workflows/_apply_result_body_font_14px.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app.py .github/workflows/_apply_result_body_font_14px.yml
          git commit -m "style: standardize result body text size"
          git push origin HEAD:ui-attributes-font-size-16px
